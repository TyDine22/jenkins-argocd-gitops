apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: spring-demo

  template:
    metadata:
      labels:
        app: spring-demo

    spec:
      containers:
        - name: spring-demo
          image: dinety/spring-gitops-demo:3

          ports:
            - containerPort: 8080
